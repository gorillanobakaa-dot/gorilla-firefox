  - id: D-157-32
    title: "Gorilla.Satellite mode is a switch every user can find: in Settings and on the toolbar, in plain words, complete"
    decided: 2026-10-04
    by: maintainer
    provenance: 'chat 2026-10-04: "NUmele butonui trebuie sa fie usor de inteles . Gorilla.Satellite mode, si on hover o explicatie mai lunga,,,, facut sa mearga pe retele de 5 KB pe secundca ... none of this marketing bullshit coming soon or preview"; then "make it easy to find and quite preeminent and visible ... place it on the upper corner bar in that emprty sapce ... between the url search bar and ... ublock origin and the hamburger"'
    status: enforced
    audit: >
      2026-10-04, before build 23: proved on a copy of the unpacked build (fieldkit probes satellite-settings and
      satellite-button): the Settings switch is on the General page with its three levels and hover text over each
      whole row; the toolbar button sits right after the address bar, shows "Gorilla.Satellite mode: Off" and changes
      to the level chosen from its menu; each menu level shows its long explanation on hover; every level sets its
      prefs and Off restores the shipped values.
    why: >
      Satellite mode was only a pref (gorilla.linkmode) that nobody would find. Users in the field are not
      terminal-literate: the switch has to be where they look, say what it does, and explain itself on hover. Three
      levels: Off; Satellite (fast but far: no autoplay or video preload, longer timeouts, pages kept on disk); Very
      slow link (down to 5 KB/s: also no pictures, no web fonts, Save-Data, 6 connections per site). The words live in
      one file (browser/gorillaSatellite.ftl) that Settings and the button both read, so they cannot disagree.
      Nothing is sent anywhere. Cost: about 175 pixels of toolbar; a user can remove the button (Customize Toolbar)
      and it stays removed.
    verify:
      - tree_contains: {path: browser/components/preferences/config/privacy.mjs, text: "GORILLA UNLEASHED - SATELLITE MODE: the switch a user sees"}
      - tree_contains: {path: browser/components/preferences/preferences.xhtml, text: 'href="browser/gorillaSatellite.ftl"'}
      - tree_contains: {path: browser/locales/en-US/browser/gorillaSatellite.ftl, text: "gorilla-satellite-button-off"}
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: 'const BUTTON_ID = "gorilla-satellite-button";'}
      - tree_contains: {path: browser/themes/shared/toolbarbuttons.css, text: "#gorilla-satellite-button {"}
      - tree_contains: {path: browser/themes/shared/jar.inc.mn, text: "skin/classic/browser/gorilla-satellite.svg"}
      - tree_contains: {path: toolkit/content/widgets/lit-utils.mjs, text: '<span class="label-wrapper" title=${ifDefined(this.title)}>'}
      - pref: {name: gorilla.linkmode, value: 0}

  - id: D-157-33
    title: "Satellite mode aims at near-instant pages at 5 KB/s: mobile pages, cache kept across restarts, no re-checking in Very slow link"
    decided: 2026-10-04
    by: maintainer
    provenance: 'chat 2026-10-04: "some of the tablets today, are 13 inches but still request mobile versions of the pages and they get it. That makes them extremely fast ... combine the best of the worlds"; answer to briefs A-D: "A yes, B yes, C yes, D yes as always... we aim for the settings that makes the loading of the pages almost instant. Anything that enables us to operate at full speed on the slowest network possible like 5kB/s and still get the best experience"'
    status: enforced
    audit: >
      2026-10-04, bench on the unpacked build at 5 KB/s (Very slow link before this decision): first visit 40.9 s
      (Off: 95.6 s), the same page again 21.5 s, after a restart 40.9 s. The restart number exposed that Gorilla
      empties the cache at every shutdown (privacy.clearOnShutdown.cache), so the 256 MB disk cache of D-157-30 never
      survived a restart; the repeat number is the page's 103 KB HTML downloaded again. Probe satellite-mobile proved
      the identity a local page receives at every level (header and navigator), the per-site desktop switch, the
      tick-box, and that Off removes every override.
    why: >
      While a satellite level is on: (A) the cache is no longer emptied at shutdown (history, form data and downloads
      still are); (B) in Very slow link a page already in the cache is shown without asking the site whether it
      changed (browser.cache.check_doc_frequency 2; Reload fetches a fresh copy); (C) sites are told the browser is
      Firefox for Android (Mozilla's own Android values), so they send their much smaller phone pages; a tick-box
      turns it off and a toolbar menu item sends one site back to its desktop version. Costs accepted by the
      maintainer: visited pages stay on disk after closing; a page can be out of date until Reload; a phone
      identity on a large screen is a rare mix a site could notice, and a site switched back to desktop still sees
      the Android navigator.platform. (D) Very slow link runs no JavaScript, per tab, with "This site: allow
      JavaScript" in the toolbar menu and a tick-box to turn it off: measured on real sites over the owner's link
      with pictures and fonts already off, BBC News 1,175 KB -> 101 KB, Guardian 685 -> 148 KB, CNN 11,831 ->
      608 KB, Reuters 2,142 -> 315 KB, DuckDuckGo 1,511 -> 207 KB, Wikipedia 384 -> 322 KB, text readable on all
      six (pictures of each page looked at). Mobile pages alone barely changed those sizes (most sites send one
      responsive page; Wikipedia's mobile page was larger with scripts on). Cost of (D): sites that are
      applications (webmail, maps) need the per-site allow. Off is unchanged.
    verify:
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: '"privacy.clearOnShutdown_v2.cache": false,'}
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: '"browser.cache.check_doc_frequency": 2,'}
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: '"browser.cache.disk_cache_ssl": true,'}
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: 'const DESKTOP_SITE_PERM = "gorilla-desktop-site";'}
      - tree_contains: {path: browser/locales/en-US/browser/gorillaSatellite.ftl, text: "gorilla-satellite-mobile-pages"}
      - tree_contains: {path: browser/components/preferences/config/privacy.mjs, text: 'id: "gorillaMobilePages"'}
      - pref: {name: gorilla.linkmode.mobile_pages, value: true}
      - pref: {name: gorilla.linkmode.no_javascript, value: true}
      - tree_contains: {path: browser/modules/GorillaLinkMode.sys.mjs, text: 'const JS_SITE_PERM = "gorilla-javascript-site";'}
      - tree_contains: {path: browser/components/preferences/config/privacy.mjs, text: 'id: "gorillaNoJavascript"'}
      - pref: {name: privacy.clearOnShutdown_v2.cache, value: true}

