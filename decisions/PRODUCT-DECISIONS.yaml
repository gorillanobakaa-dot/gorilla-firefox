  - id: D-157-35
    title: One master Gorilla logo for every large picture, and no Gorilla drawn small anywhere in the browser
    decided: 2026-10-07
    by: maintainer
    provenance: 'chat 2026-10-07: "have ONLY ONE icon. not a set of icons ... LINKED throughout all those menues and over 40 pages"; "In cases like these i would rather NOT HAVING ANY icon at all ... it just eats ram and cpu cycles"; "yes go ahead"; 2026-10-08, on the small icon files still showing a tiny Gorilla (address-bar chip, tab icons, about:processes, about:pdf): "go for 1"'
    covers: ["browser/branding/gorilla/*", "toolkit/components/aboutpdf/*"]
    owner_words: "The Gorilla artwork was made to be seen at high resolution. Shrunk to a small icon, nothing in it can be made out, so the small icons were removed instead of shown unclear (owner, 2026-10-14)."
    status: enforced
    audit: >
      2026-10-07, build 28 as installed: the logo shipped as 11 files (9.8 MB of the build's 16.7 MB of images:
      about-logo.svg wrapping a 1400 px PNG, 1000 and 500 px PNGs, private copies, a 768 px about.svg, ...). An SVG
      that wraps a raster makes Firefox decode the whole photo in every process that shows it: 12-21 MB per
      process (probe image-memory); 14.3 MB of images on the new tab. The artwork was also drawn at 24 px beside
      the page titles of Settings, Add-ons, Firefox View and Policies (visual RT-TINYLOGO).
    why: >
      The Gorilla theme was designed on Linux around ONE icon linked everywhere, so pages do not carry their own
      copies into memory. The one master is browser/branding/gorilla/content/about-logo.png (1400 px, the exact
      pixels of the retired wrapper, Lanczos-made from the canonical 2598 px master): one file, decoded once per
      process at the size it is drawn. With every page pointing at it the new tab holds 6.0 MB of images instead
      of 14.3, the private window 10.9 instead of 25.8, and the pictures are pixel-identical. Below 64 CSS px the
      artwork's detail is lost, so it is not drawn there at all (page-title logos, sidebar category icons, a
      16 px toolbar button and menu item). 2026-10-08, the same for the 16-128 px icon ladder: no Gorilla as a tab
      icon or page favicon, none in the address-bar chip of browser pages (the "Gorilla" label stays), none in
      about:processes or about:pdf; rows and dialogs that need a symbol use Firefox's neutral ones (info, reload,
      pdf, page, folder). The ladder stays for Windows (program and file-type .ico files) and where technique
      T-157-35-B lists why (never shown in Gorilla, written to a file, or 64 px and more). Cost: no Gorilla in the
      tab strip or address bar; the brand shows large on the pages instead. 2026-10-08, part 3: Firefox decodes a
      CSS picture once at its full size when a page first shows it and keeps that unlocked copy until memory
      pressure (7.8 MB per process for the master logo, measured with probe image-surfaces: still there after 75 s);
      for the browser's own pictures (chrome://, resource://) the full-size copy is dropped as soon as a smaller copy
      is decoded (image/SurfaceCache.cpp). Web content keeps Firefox's behaviour. 2026-10-08, part 5
      (owner: the Library window and about:telemetry): windows with the system caption no longer draw the
      program icon at 16 px beside their title (WTNCA_NODRAWICON; the taskbar, Alt+Tab and the system menu keep
      it), and the error card of blocked and failed pages, which draws its picture inside its own shadow root
      where the theme's override cannot reach, names the master instead of Mozilla's illustrations.
    verify:
      - tree_lacks: {path: toolkit/components/aboutpdf/content/aboutPDF.html, text: "chrome://branding/content/icon"}
      - fieldkit_test: tests/test_buildh_techniques_one_logo.py
      - tree_contains: {path: browser/themes/shared/identity-block/identity-block.css, text: "GORILLA D-157-35: no 16 px Gorilla in the address bar on browser pages"}
      - tree_lacks: {path: browser/components/tabbrowser/Tabbrowser.sys.mjs, text: '"about:newtab": "chrome://branding/content/icon32.png"'}
      - tree_contains: {path: image/SurfaceCache.cpp, text: "void PruneUnusedNativeSize(Function&& aRemoveCallback)"}
      - tree_contains: {path: browser/themes/shared/master-redirect.css, text: '--gorilla-master-icon: url("chrome://branding/content/about-logo.png");'}
      - tree_contains: {path: toolkit/content/widgets/moz-page-nav/moz-page-nav.css, text: "GORILLA D-157-35: no 24 px Gorilla beside the page title"}
      - image_sharp: {path: browser/branding/gorilla/content/about-logo.png, master: "owner:gorilla-patchset/deb_template/usr/share/icons/hicolor/1024x1024/apps/gorilla-unleashed.png"}
