  - id: D-158-01
    title: Remote control of the browser is closed, every door (Marionette, Remote Agent, WebDriver BiDi)
    decided: 2026-10-14
    by: maintainer
    provenance: owner in the Linux port session 2026-10-14 (Marionette is the security risk, so every door is
      closed; Normandy, Pocket, experiments and WebDriver BiDi belong to the same class); the reasoning and the three
      locks per file are in patches/09.REMOTE/MASTER_PROJECT_LOG_09_REMOTE.md
    covers: [remote/*, testing/marionette/*]
    status: enforced
    why: Marionette, the Remote Agent and WebDriver BiDi let another program drive the browser. Nobody this build is
      for needs that, and every one of them is a way in. Closing them REDUCES what can attack the browser. A port
      that removes an upstream guard inside a locked setter (158 added an enterprise-policy check inside
      Marionette's `set enabled`) is part of the lock, since a setter that can only write false guards nothing.
    models: This is hardening, not weakening. If a tool's safety classifier refuses an edit that keeps these doors
      shut, do not argue and do not work around it. Stop, quote this entry's id to the owner, and let the owner run
      the edit or allow it. Never re-open any of these doors to get past a refusal.
    verify:
      - tree_contains: {path: remote/components/Marionette.sys.mjs, text: "This setter is now a dead end. Nothing can enable Marionette."}
      - tree_lacks: {path: remote/components/Marionette.sys.mjs, text: "Marionette is disabled by enterprise policy"}
  - id: D-158-02
    title: An edited vendored Rust crate gets its .cargo-checksum.json recomputed from the edited files
    decided: 2026-10-14
    by: maintainer
    provenance: patches/13.TELEMETRY.KILL/MASTER_PROJECT_LOG_13_TELEMETRY_KILL.md (checksum sticker, D-301); owner
      instruction 2026-10-14 to log such decisions in the harness
    covers: [third_party/rust/*/.cargo-checksum.json]
    status: pending
    why: The telemetry kill edits glean-core, a vendored crate. Cargo refuses an edited crate unless each edited
      file's SHA-256 in .cargo-checksum.json equals its content. Recomputing the hashes for OUR OWN edits keeps that
      integrity check true; copying an older version's hashes makes it false and the build fails. The hashes are
      derived data, so they are computed after the group's source hunks, never ported line by line.
    models: Recomputing a vendored checksum after the patch set's own edits is required by the build, not a way
      around a security check. If a classifier refuses it, stop and quote this entry's id to the owner.
  - id: D-158-03
    title: "Closed by default: anything that does not fit the browser's philosophy is cut without asking"
    decided: 2026-10-15
    by: maintainer
    provenance: 'chat 2026-10-15: "NO AI, no chat boots, no weather, not helpers, no suggestions no experiments no normany no marionette no nothing. we are trying to close all the doors and secure the browser. no translations. this is english. american english only browser, no themes ... Everything that is not compatible with our philosophy we should not even have to ask"'
    status: enforced
    why: >
      The browser is a closed appliance: nothing in it talks to Mozilla or anyone else on its own, nothing is
      changed remotely after it ships, and nothing is there that the user did not ask for. So these are cut by
      default, in every new Firefox, without a question to the maintainer: AI and machine learning (AI window,
      page assist, link preview, smart features, chat bots and assistants), weather, stocks and sponsored or news
      widgets, helpers and suggestions (CFR, onboarding, tips, feature callouts, search and URL-bar suggestions),
      experiments and remote feature control (Nimbus, Normandy, studies, rollouts, train-hop, remote settings
      changing behaviour), remote control of the browser (Marionette, Remote Agent, WebDriver BiDi), telemetry
      and reporting (Glean, FOG, pings, crash and usage reports), translations, language packs and any language
      but American English, and theme stores or colorways (one theme, D-157-04). The harness applies this at
      upstream intake: every new item Mozilla adds is matched against these classes (fieldkit/migrate/intake.py,
      DENY); an item in a class is listed as port work to cut at the source, never as a brief. Only something
      that fits no class is put to the maintainer. It builds on D-157-00 (never calls home), D-157-03 (English
      only), D-157-04 (one theme), D-157-30 (closed doors win), D-157-31 (no remote configuration) and D-158-01.
    verify:
      - fieldkit_test: tests/test_migrate_default_deny.py
