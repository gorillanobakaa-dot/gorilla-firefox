  - id: D-157-30
    title: "Standing decision policy: speed, responsiveness, low RAM and closed doors win, unless a recorded trade-off says otherwise"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03: "the user prefers anything that speeds up download and upload speeds, improve the firefox responsiveness, minimizes the RAM memory usage footprint. closes open doors left by glean foag telemetry etc etc. that should help you take decisions automatically. the only trade offs are the ones recorded"'
    status: trade-off
    why: >
      When a brief's options differ only in these terms, the option that is faster (download, upload, latency,
      responsiveness), lighter (RAM) or closes a reporting/telemetry door is chosen without asking, and recorded with
      this entry as its provenance. Exceptions are only the recorded trade-offs (e.g. D-157-28: users stay logged in,
      because re-entering e-mail passwords after every restart drew complaints; D-157-12 video). Anything that opens a
      network door, weakens security, or touches a recorded trade-off still needs the maintainer.

  - id: D-157-31
