  - id: D-157-40
    title: "Hidden about: pages: every page the source can register is reviewed in decisions/ABOUT-PAGES.yaml; the 16 that serve Mozilla, its tests or switched-off features are gone, and what fed them is cut"
    decided: 2026-10-08
    by: maintainer
    provenance: 'chat 2026-10-08: "why is the about:fingerprintingprotection page shown in about: about?"; "Dive deep in all the about: pages and find each and every one that is hidden ... Afterwards let''s eliminate all of them. everything we can get away with it from the source code and made all those page removal patches and permanent part of our harness"; standing policy D-157-30'
    status: enforced
    audit: >
      2026-10-08, build 28 (20261008151853) and the source: the source names 84 about: pages, the build registered
      70, about:about listed 40 and hid 30. Every hidden page was opened and pictured (probe about-pages, shots) and
      read in the source (Work.to.do/hidden-pages/research A, B, C). about:fingerprintingprotection is the measuring
      page of Mozilla's user-characteristics study, loaded by an invisible browser once per study wave; asrouter and
      messagepreview are Mozilla's messaging console and preview; referrals redirects to firefox.com with a
      per-profile code; crashparent/crashcontent/crashgpu/crashextensions kill the browser, a tab's process, the GPU
      process or every add-on from one typed address (test tools); blocked and restricted serve Safe Browsing and
      parental controls, both absent; settings and performance are second names; the four profile-switcher pages
      opened blank. Also found: the network error page looked up a guessed name (www.<word>.com) on its own;
      ShouldEnforceParentalControls dereferenced a null service when security.restrict_to_adults.respect_platform
      was set (a browser crash); a Nightly-only line still registered the excised about:inference. 2026-10-09, the
      page-by-page reading after the registrations were removed: a profiles.ini from upstream Firefox (a store ID)
      still forced the profile switcher on whatever the locked pref said; the messaging console's commands were
      still accepted from about:welcome, about:newtab, about:home and about:privatebrowsing (the parent never checked
      the sender); and the removed pages' own files were still packaged, so their chrome:// addresses still opened.
    why: >
      Every channel is a door, and a hidden page is a door nobody checks. The 16 pages are removed from the page
      registry (nsAboutRedirector.cpp, AboutRedirector.cpp, both components.conf) with the code that only they used
      (the crash channel, the referral and profile gates). What fed them is cut at source: the user-characteristics
      collection never starts (nsRFPService.cpp) and its opt-out is locked on; the messaging console's switch, the
      referral switch, and the profile selector at start-up (GetShowProfileSelector) are off for good; parental
      controls are never enforced (no service is built). The network error page no longer makes the guessed lookup.
      Nothing forces the profile switcher on (SelectableProfileService); the messaging console's commands are refused
      whoever sends them (ASRouterParentProcessMessageHandler); the removed pages' files are not packaged
      (asrouter-admin, messagepreview and its actors, usercharacteristics, aboutRestricted, blockedSite), so no
      chrome:// address opens them either.
      Kept, each with its reason in the register: the 14 hidden pages the browser needs (error, crash-recovery,
      session, Reader View, Split View, DevTools, cache detail) and every listed page. The register is enforced
      before the build (this decision) and after it (build-harness about-pages compares the pages a build
      registers). Cost: a crashed tab can no longer be provoked by hand for testing; a profiles.ini from upstream
      Firefox with ShowSelector=1 starts straight into the default profile; one-word addresses that fail get no
      "did you mean www.<word>.com" hint.
    verify:
      - about_register: {file: decisions/ABOUT-PAGES.yaml}
      - tree_lacks: {path: docshell/base/nsAboutRedirector.cpp, text: "class CrashChannel final"}
      - tree_contains: {path: toolkit/components/resistfingerprinting/nsRFPService.cpp, text: "GORILLA D-157-40 (2026-10-08): no user-characteristics collection."}
      - tree_lacks: {path: toolkit/components/resistfingerprinting/nsRFPService.cpp, text: "    nsUserCharacteristics::MaybeSubmitPing();"}
      - tree_contains: {path: docshell/base/CanonicalBrowsingContext.cpp, text: "GORILLA D-157-40 (2026-10-08): Gorilla is built --disable-parental-controls"}
      - tree_contains: {path: toolkit/profile/nsToolkitProfileService.cpp, text: "GORILLA D-157-40 (2026-10-08): the new profile switcher"}
      - tree_contains: {path: toolkit/actors/NetErrorChild.sys.mjs, text: "GORILLA D-157-40 (2026-10-08): no guessed lookups."}
      - tree_lacks: {path: docshell/build/components.conf, text: "about_pages.append('inference')"}
      - pref: {name: toolkit.telemetry.user_characteristics_ping.opt-out, value: true, locked: true}
      - pref: {name: toolkit.telemetry.user_characteristics_ping.send-once, value: false, locked: true}
      - pref: {name: browser.referrals.enabled, value: false, locked: true}
      - pref: {name: browser.newtabpage.activity-stream.asrouter.devtoolsEnabled, value: false, locked: true}
      - tree_contains: {path: browser/components/profiles/SelectableProfileService.sys.mjs, text: "GORILLA D-157-40 (2026-10-09): no forcing on."}
      - tree_contains: {path: browser/components/asrouter/modules/ASRouterParentProcessMessageHandler.sys.mjs, text: "if (CONSOLE_COMMANDS.has(name) && !ASRouterPreferences.devtoolsEnabled) {"}
      - omni_absent: [chrome/browser/content/browser/asrouter/asrouter-admin, chrome/browser/content/browser/messagepreview/, actors/AboutMessagePreview, chrome/toolkit/content/global/usercharacteristics/, chrome/toolkit/content/global/aboutRestricted/, localization/en-US/locales-preview/aboutRestricted.ftl, chrome/browser/content/browser/blockedSite, chrome/browser/skin/classic/browser/blockedSite.css]
      - fieldkit_test: tests/test_buildh_about_register.py

  - id: D-157-41
    title: "The console's scam warning is on: a paste into the developer console waits until the user types \"allow pasting\" once"
    decided: 2026-10-09
    by: maintainer
    provenance: 'chat 2026-10-09: "it makes sense to drop it to 0" (after the explanation of devtools.selfxss.count and the options for the console); the removal of the console itself was weighed and not taken'
    status: enforced
    audit: >
      2026-10-09, reading the hidden pages: Gorilla's branding set devtools.selfxss.count to 5, as Firefox's Nightly
      and unofficial brandings do; release Firefox sets 0. At 5 the web console never shows its "Scam Warning" and a
      pasted script runs at once, in the page the user is logged in to (self-XSS: "press F12 and paste this").
    why: >
      Gorilla is made for people who are not terminal-literate; they are who "paste this into the console" scams aim
      at. At 0 the console blocks a paste until "allow pasting" is typed once, or until five commands have been typed
      by hand; it then raises the count to 5 itself, so the pref is not locked. Nothing is sent anywhere either way.
      Cost: a developer types "allow pasting" once; the address bar's Inspector quick action and the "Inspect
      Accessibility Properties" item stay hidden until the developer tools have been used. Kept on purpose: the
      console and the developer tools themselves (they send nothing, and they are how anyone can check what Gorilla
      and a page do); the console that runs code with the browser's own powers is already shut (devtools.chrome.enabled
      locked off).
    verify:
      - tree_contains: {path: browser/branding/gorilla/pref/firefox-branding.js, text: 'pref("devtools.selfxss.count", 0);'}
      - pref: {name: devtools.selfxss.count, value: 0}
  - id: D-157-42
    title: "The built-in security lists (Certificate Transparency logs, key pins, HSTS preload) are taken fresh at every build, and no release ships with one that switches off within six weeks"
    decided: 2026-10-09
    by: maintainer
    provenance: 'chat 2026-10-09, choosing option 1 (refresh at build time) of the time-bomb finding: "I think we can go with number one. Since once per month, or following the Mozilla release cycle we''re going to release a new update"'
    status: enforced
    audit: >
      2026-10-09, the first proactive scan (build-harness timebombs): three dates compiled into build 29 switch a
      protection off without a word. Certificate Transparency, enforced in Gorilla (mode 2), is skipped from
      2026-12-01 (CertVerifier.cpp: "skipping CT - built-in information has expired"); key pinning stops on
      2026-12-25; HSTS preload on 2027-01-22. Firefox users never meet them because their browser updates itself
      every four weeks; Gorilla does not. Mozilla stamps the CT list to expire about ten weeks after it is made.
    why: >
      An update channel stays closed: the lists are pulled when the maintainer builds, from the repository the
      harness already takes Firefox from (Mozilla's own; it sees one more fetch from the build machine and learns
      nothing new), and a file is taken only when it is pure data that expires later than the tree's
      (build-harness lists-refresh; then recorded like any change). Build-verify fails a build whose lists switch off
      within six weeks of the build day, and release-check a release within six weeks of publishing. Cost: a Gorilla
      build keeps Certificate Transparency checking for at most about ten weeks from its build day, so releases
      follow Mozilla's four-week cycle; a user who skips two releases loses it until they install a new one.
    verify:
      - fieldkit_test: tests/test_buildh_timebombs.py
