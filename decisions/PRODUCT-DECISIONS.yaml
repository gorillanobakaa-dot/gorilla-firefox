    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03: "trebuie sa tinem Normandy and all the other shitty experiments turned off... I had enough of mozilla and their sneaky way of prefFlips .... Anything that gives Firefox a remote configuration and experimentation control plane that can change parts of the browser after the binary has shipped is a big no no"; and on the new tab Nimbus wait: "putem ori sa eiminam asta ori sa o highjack it?" (eliminated)'
    covers: [toolkit/components/normandy/*, toolkit/components/nimbus/*]
    status: enforced
    audit: >
      2026-10-03, build 19: the new tab and start page were blank. Firefox 157 builds the page only after Nimbus's
      newtabTrainhop feature reports ready; Normandy is cut (the only caller of ExperimentAPI.init in 157), so Nimbus
      never answered. The same feature carries "train-hop": Mozilla can replace the whole new-tab page with an XPI
      downloaded from archive.mozilla.org and push layout, ads, widget and default-pref changes to it.
