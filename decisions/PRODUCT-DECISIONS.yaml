  - id: D-157-36
    title: "No developer pages that record for Mozilla or hand it data: about:glean, about:logging, about:profiling and about:windows-messages are gone, and a captured profile goes only to a viewer on this machine"
    decided: 2026-10-08
    by: maintainer
    provenance: 'chat 2026-10-08: "I thought we disabled about:logging capabilities from the source code, not only from prefs"; "about:windows-messages ... I do not recall working on that"; standing policy D-157-30 (closed doors and speed win)'
    status: enforced
    audit: >
      2026-10-08, build 28 as installed, every about: page opened by probe about-pages behind a dead proxy:
      about:glean is the test bench of Glean, Mozilla's telemetry library (debug-tagged pings for Mozilla's Glean
      Debug Ping Viewer, metric values, links to Mozilla's data dictionary); its menus showed text and its submit
      button did nothing, because Glean never starts in Gorilla (FOG.cpp). about:logging and about:profiling ended a
      recording by opening profiler.firefox.com, Mozilla's hosted viewer, with the captured profile (open tabs,
      addresses, timings), and about:logging could upload it to api.profiler.firefox.com; about:processes had a
      profiler button per process doing the same. about:windows-messages showed the last six of each listed window
      message per window, which the browser formatted into strings and kept for it all the time.
    why: >
      Every channel is a door: a vendor-hosted viewer is code delivered by the vendor and a place the data lands,
      and a telemetry test bench for a library that never runs is a door with nothing behind it but a button.
      The four pages are removed from the page registry (nsAboutRedirector.cpp, AboutRedirector.cpp,
      components.conf); the profiler's hand-off refuses any viewer that is not on this machine (localhost,
      127.0.0.1, [::1]) at source, so the devtools Performance panel fails closed too; about:processes has no
      profiler buttons; nothing is recorded for about:windows-messages (nsWindowDbg.cpp); no link is left to the
      removed pages (about:networking's Logging entry, about:webrtc's Enable logging button) and DevTools has no
      Performance panel, whose recording ended in the refused hand-off. Kept: MOZ_LOG in the
      environment still logs to a file (the leak gate's HTTP log uses it), and the Gecko profiler itself stays
      compiled. Cost: no built-in profiler or logging page; profile with the harness (build-harness weigh, the
      probes) or a profiler viewer run locally.
    verify:
      - tree_lacks: {path: docshell/base/nsAboutRedirector.cpp, text: '{"glean", "chrome://global/content/aboutGlean.html",'}
      - tree_lacks: {path: docshell/base/nsAboutRedirector.cpp, text: '{"logging", "chrome://global/content/aboutLogging/aboutLogging.html",'}
      - tree_lacks: {path: docshell/base/nsAboutRedirector.cpp, text: '{"windows-messages", "chrome://global/content/aboutWindowsMessages.html",'}
      - tree_lacks: {path: browser/components/about/AboutRedirector.cpp, text: '"chrome://devtools/content/performance-new/aboutprofiling/index.html",'}
      - tree_lacks: {path: docshell/build/components.conf, text: "about_pages.append('glean')"}
      - tree_contains: {path: devtools/client/performance-new/shared/browser.js, text: "GORILLA D-157-36 (2026-10-08): a captured profile is never handed to a site on the network."}
      - tree_contains: {path: widget/windows/nsWindowDbg.cpp, text: "bool recordInAboutPage = false;"}
      - tree_contains: {path: modules/libpref/init/all.js, text: 'pref("toolkit.aboutProcesses.showProfilerIcons", false);'}
      - tree_lacks: {path: toolkit/content/aboutNetworking.html, text: 'href="about:logging"'}
      - tree_lacks: {path: toolkit/content/aboutwebrtc/aboutWebrtc.mjs, text: "    add(new EnableLogging().render());"}
      - tree_contains: {path: browser/app/profile/firefox.js, text: 'pref("devtools.performance.enabled", false);'}
      - fieldkit_test: tests/test_buildh_aboutpages.py


