# Version: 1.0.0 · updated 26-10-14-18-38
# ONE register for Linux and Windows, like the one patch set (SETTLED 2026-10-14). Both harnesses read it:
#   Linux: ~/.local/bin/fieldkit build-harness decisions TASK    Windows: fieldkit build-harness decisions TASK
# D-157-00..42 come from the Windows owner repo (Gorilla.firefox, last changed 2026-10-09, commit 6f2d835),
# copied on 2026-10-14. Since then only platform tags and Linux twin checks were added (D-157-01, D-157-22).
# D-158-* were added on Linux. A whole entry may say `platforms: [linux]` or `[windows]`, a single check
# `platform: linux` or `windows`; absent means both. Paths under gorilla-patchset/ resolve to the patch set,
# which is a subfolder of the owner repo on Windows and the harness folder itself on Linux. `covers:` globs name
# the tree files an entry governs; a port packet touching one quotes the entry before any edit is made.
# Gorilla Firefox: the maintainer's product decisions, each one a check.
#
# Every build is checked against this file: `fieldkit build-harness decisions <task>` and the post-install
# "decisions" row. A release and the regression baseline need every entry ENFORCED (--strict): a PENDING entry
# blocks them. The baseline records this file's sha256, so "the baseline" always means "this build, with these
# decisions".
#
# Rules:
# - Only the maintainer decides. An agent may ADD an entry with status: pending and provenance naming where the
#   maintainer said it; it never changes a decision's meaning, never sets status: retired, and never deletes one.
#   Commits to this file go through the pre-commit hook (GORILLA_OWNER_APPROVED=1, set by the maintainer only).
# - status: enforced needs at least one verify check. A decision nobody verifies is forgotten (that is how decisions
#   from an earlier port were lost).
# - why: what the user gains and what it costs them. Convenience matters: a protection users hate gets switched off.
# - Check kinds: see fieldkit/buildh/decisions.py.

release: "157.0"

decisions:

  - id: D-157-00
    title: "THE RULE: this browser never calls home"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("THIS BROWSER NEVER CALLS HOME. this browser is a privacy and security hardened browser ... We are going to make only a few compromises but only minor ones")
    status: enforced
    why: >
      Gorilla contacts only the sites the user opens. No Mozilla, Google, Microsoft, Cloudflare or certificate
      authority is contacted on the browser's own initiative: no telemetry, updates, experiments, suggestions,
      pings, prefetch, location or background downloads. Security wins over convenience; the only compromises are
      the ones listed in this file as trade-offs (D-157-08 captchas, D-157-12 video). Any new Firefox feature that
      calls out is cut at the source before a release, and every cut is checked here or by the leak gate. Cost:
      features that need a server (sync, suggestions, translations, location, automatic updates) do not exist.
    verify:
      - fieldkit_test: tests/test_leakgate.py

  - id: D-157-01
    title: No automatic updates
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 (reaffirmed; decided for the Debian build before)
    status: enforced
    why: >
      The browser never downloads or installs anything by itself and never contacts an update server. To update, the
      user downloads a new build and replaces the old one. Cost: updates are manual.
    verify:
      - mozconfig_has: {file: config/mozconfig.win64, platform: windows, text: "ac_add_options --disable-updater"}
      - mozconfig_has: {file: gorilla-patchset/mozconfig, text: "ac_add_options --disable-updater"}
      - mozconfig_has: {file: config/mozconfig.win64, platform: windows, text: "ac_add_options --disable-maintenance-service"}
      - installed_absent: [updater.exe, maintenanceservice.exe, maintenanceservice_installer.exe, updater.ini]
      - tree_contains: {path: toolkit/modules/UpdateUtils.sys.mjs, text: "PHYSICAL LOCK (D-157-01): nothing about updates is written outside the profile"}

  - id: D-157-02
    title: "Content sandbox: level 4 on Linux; Mozilla's own Windows level on Windows"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("make the 4 linux-only, keep 9 on windows")
    status: enforced
    why: >
      Level 4 is the strict setting on Linux; Windows uses a different scale where Mozilla's default is its strictest.
      Forcing the Linux number on Windows weakened the Windows sandbox. Users notice nothing.
    verify:
      - tree_contains: {path: modules/libpref/init/all.js, text: "#ifdef XP_LINUX\npref(\"security.sandbox.content.level\", 4);\n#endif"}

  - id: D-157-03
    title: English only - no language packs, no translations, no locale switching
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("Gorilla browser was an english only ... no translation"); same on the Debian build
    status: enforced
    audit: >
      2026-10-02 audit of build 11: only en-US ships (res/multilocale.txt, localization/en-US only). Gaps:
      intl.multilingual.enabled and downloadEnabled ship TRUE (Gorilla's false lines in firefox.js are overridden by
      Mozilla's later RELEASE_OR_BETA block; the same bug was in 155.0.1), so Settings offers a language switcher.
      Translations are disabled in code with locked prefs, but the code and its model/wasm dumps still ship.
    why: >
      One language means no translation engine (which downloads models and sends text) and no language-pack add-ons
      (a side door for extensions). Cost: the interface is English only.
    verify:
      - pref: {name: intl.multilingual.enabled, value: false, locked: true}
      - pref: {name: intl.multilingual.downloadEnabled, value: false, locked: true}
      - pref: {name: browser.translations.enable, value: false, locked: true}
      - omni_absent: [chrome/toolkit/content/global/translations/, translations/, defaults/settings/main/translations-models.json, defaults/settings/main/translations-wasm.json]

  - id: D-157-04
    title: One theme only - the Gorilla dark theme (pink tabs, cyan borders); no switching to light or any other theme
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("Gorilla browser had only one theme OUR, the approved one")
    status: enforced
    audit: >
      2026-10-02 audit of build 11: NOT locked. Mozilla's light, dark and alpenglow themes and the "System theme -
      auto" default still ship (also in 155.0.1); installing themes is blocked but enabling a built-in one is not,
      and Settings links to the theme list. The Gorilla look is patched CSS (master-redirect.css, !important), so
      most colours survive another theme, but the background image does not. ui.systemUsesDarkTheme = 1 and
      browser.theme.content-theme = 0 ship unlocked.
    why: >
      One approved look, no theme add-ons (themes are add-ons: a side door), nothing for a page to fingerprint by
      theme. Cost: no choice of look. Web pages keep their own dark mode: this is about the browser's frame.
    verify:
      - omni_absent: [chrome/browser/content/builtin-themes/light/, chrome/browser/content/builtin-themes/dark/, chrome/browser/content/builtin-themes/alpenglow/]
      - pref: {name: ui.systemUsesDarkTheme, value: 1, locked: true}
      - pref: {name: browser.theme.content-theme, value: 0, locked: true}

  - id: D-157-05
    title: No extensions except uBlock Origin
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 (reaffirmed; "the only exception was the addblock")
    status: enforced
    audit: >
      2026-10-02 audit of build 11: PARTLY. uBlock Origin is bundled and every install route (file, website,
      about:addons, themes, language packs) is cut in XPIInstall/AddonManager. Gaps: about:debugging "Load Temporary
      Add-on" bypasses the cuts (installTemporaryAddon), and devtools.chrome.enabled / devtools.debugger.remote-enabled
      ship true (not an official build), which opens the chrome-privileged Browser Console.
    why: >
      Extensions are the biggest privacy side door in a browser. uBlock Origin stays because it removes ads and
      trackers and its filter-list updates are its own. Cost: no other add-ons, and uBlock itself updates only with a
      new Gorilla build.
    verify:
      - pref: {name: devtools.chrome.enabled, value: false, locked: true}
      - pref: {name: devtools.debugger.remote-enabled, value: false, locked: true}
      - tree_contains: {path: toolkit/mozapps/extensions/internal/XPIInstall.sys.mjs, text: "GORILLA UNLEASHED - PHYSICAL LOCK: no temporary add-ons"}

  - id: D-157-06
    title: "Fingerprinting: the light protection on and locked; the Tor-style mode off and NOT locked; local time kept"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 (option 3, recommended variant; "let's keep the local hour ... the feedback was really strong")
    status: enforced
    why: >
      fingerprintingProtection blurs what sites can measure (canvas and others) while keeping local time, page dark
      mode and per-site zoom: almost nobody notices it. resistFingerprinting forces UTC time, light pages, en-US and
      canvas prompts; users rejected that before, so it is opt-in. No GPU model string, no local network
      candidates hidden by mDNS in WebRTC (no_host lock removed 2026-10-03 on the owner's word: "1 yes remove no_host" - it broke same-LAN calls). No motion or orientation sensors. Location: see D-157-13.
    verify:
      - pref: {name: privacy.fingerprintingProtection, value: true, locked: true}
      - pref: {name: privacy.resistFingerprinting, value: false, locked: false}
      - pref: {name: privacy.resistFingerprinting.letterboxing, value: false}
      - pref: {name: webgl.enable-debug-renderer-info, value: false, locked: true}
      - pref: {name: media.peerconnection.ice.no_host, value: false, locked: false}
      - pref: {name: device.sensors.enabled, value: false, locked: true}

  - id: D-157-07
    title: "Revocation: offline only - the revocation list ships inside each build; no OCSP, no Remote Settings, no calls"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("de fapt vreau lista offline ... sa ai cat mai putina comunicare cu orice site posibil ... doesn't call home"; replaces the earlier "B after the CRLite check" and "A+D")
    status: enforced
    why: >
      The browser does not call home and does not ask certificate authorities about the sites the user visits.
      Revoked intermediate certificate authorities are still refused, from the list bundled in the build (OneCRL,
      loaded at startup without any network). Cost, stated in the public privacy report: revocation of ordinary
      site certificates is not checked, and the bundled list is only as fresh as the build. Releases are about
      monthly, and each port takes Mozilla's newest dump from the release source.
    audit: >
      2026-10-02: CRLite cannot work (its filters come only through Remote Settings, which is cut) and with CRLite in
      enforce mode Firefox already skipped live OCSP for public sites; the bundled OneCRL dump (1,880 records, June
      2026 in 157.0) was never applied, because records reach certificate storage only on a sync event.
    verify:
      - pref: {name: security.OCSP.enabled, value: 0, locked: true}
      - tree_contains: {path: security/manager/ssl/RemoteSecuritySettings.sys.mjs, text: "GORILLA UNLEASHED - PHYSICAL LOCK: offline OneCRL"}
      - tree_contains: {path: services/settings/dumps/security-state/onecrl.json, text: "\"data\""}

  - id: D-157-12
    title: "The video compromise: Widevine (Netflix, YouTube films) and OpenH264 (video calls), fetched only when a page needs them"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("netflix and youtube ... people need these ... and from time to time to make webrtc video calls... let's keep that")
    status: enforced
    why: >
      Without them protected films do not play and some video calls fail. They cannot be shipped inside the build
      (their licences forbid it), so they are downloaded - but only when a page actually asks for protected video
      or a call needs H.264, never at startup or in the background, and straight from the makers (Google, Cisco)
      using addresses and checksums built into Gorilla, never through Mozilla's update server.
    verify:
      - pref: {name: media.eme.enabled, value: true, locked: true}
      - pref: {name: media.gmp-widevinecdm.enabled, value: true, locked: true}
      - pref: {name: media.gmp-gmpopenh264.enabled, value: true, locked: true}
      - tree_contains: {path: toolkit/modules/GMPInstallManager.sys.mjs, text: "GORILLA UNLEASHED - PHYSICAL LOCK: video plugins on demand"}

  - id: D-157-13
    title: No location, ever
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("location? ... this is not a mobile browser ... no location in this browser")
    status: enforced
    why: >
      Sites cannot ask where the user is; neither Mozilla's nor Windows' (Microsoft's) location service is used.
      Cost: "find me on the map" and "nearest shop" need the address typed in.
    verify:
      - pref: {name: geo.enabled, value: false, locked: true}
      - pref: {name: geo.provider.ms-windows-location, value: false, locked: true}
      - pref: {name: permissions.default.geo, value: 2, locked: true}

  - id: D-157-14
    title: No speculative connections, prefetch, DNS prefetch, hyperlink pings or beacons
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("no bullshit downloads in the background from other pages ... No pings")
    status: enforced
    why: >
      The browser connects only to what the user opens: nothing for links merely hovered, guessed or prefetched,
      and pages cannot fire tracking pings or beacons on the way out. Cost: a first click may feel a few
      milliseconds slower.
    verify:
      - pref: {name: browser.urlbar.speculativeConnect.enabled, value: false, locked: true}
      - pref: {name: browser.places.speculativeConnect.enabled, value: false, locked: true}
      - pref: {name: network.http.speculative-parallel-limit, value: 0, locked: true}
      - pref: {name: network.dns.disablePrefetch, value: true, locked: true}
      - pref: {name: network.prefetch-next, value: false, locked: true}
      - pref: {name: browser.send_pings, value: false, locked: true}
      - pref: {name: beacon.enabled, value: false, locked: true}
      - pref: {name: network.early-hints.preconnect.enabled, value: false, locked: true}
      - pref: {name: network.preconnect, value: false, locked: true}
      - pref: {name: network.early-hints.enabled, value: false, locked: true}

  - id: D-157-15
    title: No MITM-detection ping to Mozilla
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("cut all five leaks and close every avenue")
    status: enforced
    why: >
      On an unknown-issuer certificate error the browser used to ask mitmdetection.services.mozilla.com. Cut. Cost:
      the error page no longer guesses that antivirus or a proxy is intercepting.
    verify:
      - pref: {name: security.certerrors.mitm.priming.enabled, value: false, locked: true}
      - tree_contains: {path: toolkit/actors/NetErrorParent.sys.mjs, text: "GORILLA UNLEASHED - PHYSICAL LOCK: no MITM priming"}

  - id: D-157-16
    title: Web pages may not probe the local network or this computer without asking
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("close every avenue")
    status: enforced
    why: >
      A public page can no longer scan the router, printers or local services silently. Cost: a page that really
      talks to a local device (router admin, casting) asks first.
    verify:
      - pref: {name: network.lna.blocking, value: true, locked: true}
      - tree_contains: {path: netwerk/protocol/http/DnsAndConnectSocket.cpp, text: "PHYSICAL LOCK (D-157-16): the local-network check runs BEFORE the connection"}
      - tree_contains: {path: netwerk/protocol/http/nsHttpChannel.cpp, text: "PHYSICAL LOCK (D-157-16): local network access through a proxy"}

  - id: D-157-17
    title: "Windows: no single sign-on, no trust in the Windows certificate store"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("privacy and security hardened browser ... the users can suck it")
    status: enforced
    why: >
      Windows account credentials are never sent to Microsoft logins, and certificates added to Windows by
      antivirus, proxies or employers are not trusted, so HTTPS cannot be silently intercepted. Cost: antivirus
      "HTTPS scanning" and corporate inspection proxies produce certificate errors.
    verify:
      - pref: {name: network.http.windows-sso.enabled, value: false, locked: true}
      - pref: {name: security.enterprise_roots.enabled, value: false, locked: true}
      - pref: {name: security.certerrors.mitm.auto_enable_enterprise_roots, value: false, locked: true}

  - id: D-157-18
    title: No third-party DNS (no DNS-over-HTTPS, no rollout to Cloudflare)
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("THIS BROWSER NEVER CALLS HOME")
    status: enforced
    why: >
      DNS goes to the system's own resolver only; no DNS provider is chosen for the user by region. Cost: the
      internet provider sees which names are looked up (as with every other program on the computer).
    verify:
      - pref: {name: network.trr.mode, value: 5, locked: true}

  - id: D-157-19
    title: No remote download verdicts, search suggestions, search-engine updates or region lookups
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("close every avenue")
    status: enforced
    why: >
      Nothing typed in the address bar leaves the computer before Enter; downloaded files are not described to
      Google; the browser never asks where it is. Cost: no search suggestions while typing.
    verify:
      - pref: {name: browser.safebrowsing.downloads.remote.enabled, value: false, locked: true}
      - pref: {name: browser.search.suggest.enabled, value: false, locked: true}
      - pref: {name: browser.search.update, value: false, locked: true}
      - pref: {name: browser.region.update.enabled, value: false, locked: true}

  - id: D-157-20
    title: No backup feature (its default folder is OneDrive) and no profile manager (its tour loads Mozilla CDN images)
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("close every avenue"); no OneDrive or cloud sync, ever
    status: enforced
    why: >
      Cost: no built-in profile backup or profile switcher; copy the profile folder by hand.
    verify:
      - pref: {name: browser.backup.enabled, value: false, locked: true}
      - pref: {name: browser.profiles.enabled, value: false, locked: true}

  - id: D-157-21
    title: Dormant reporting and update machinery switched off as well as cut
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("no faking calling home")
    status: enforced
    why: >
      Code paths were already cut at the source; the prefs now say so too, so nothing can wake them.
    verify:
      - pref: {name: extensions.update.enabled, value: false, locked: true}
      - pref: {name: extensions.systemAddon.update.enabled, value: false, locked: true}
      - pref: {name: datareporting.usage.uploadEnabled, value: false, locked: true}
      - pref: {name: network.connectivity-service.enabled, value: false, locked: true}
      - pref: {name: extensions.ml.enabled, value: false, locked: true}
      - pref: {name: browser.newtabpage.activity-stream.discoverystream.sections.personalization.enabled, value: false, locked: true}

  - id: D-157-22
    title: Every build configuration carries every disable (no stale mozconfig)
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("fix everything that needs to be fixed"); the patch-set copy of the Windows mozconfig had lost three disables
    status: enforced
    why: >
      Rebuilding from the patch set must give the same browser: no default-browser agent (it reported daily), no
      speech API, no Wi-Fi scanning.
    verify:
      - mozconfig_has: {file: gorilla-patchset/windows/mozconfig.win64, text: "ac_add_options --disable-default-browser-agent"}
      - mozconfig_has: {file: gorilla-patchset/windows/mozconfig.win64, text: "ac_add_options --disable-webspeech"}
      - mozconfig_has: {file: gorilla-patchset/windows/mozconfig.win64, text: "ac_add_options --disable-necko-wifi"}
      - mozconfig_has: {file: config/mozconfig.win64, platform: windows, text: "ac_add_options --disable-default-browser-agent"}
      - mozconfig_has: {file: gorilla-patchset/mozconfig, text: "ac_add_options --disable-default-browser-agent"}
      - mozconfig_has: {file: gorilla-patchset/mozconfig, text: "ac_add_options --disable-webspeech"}
      - mozconfig_has: {file: gorilla-patchset/mozconfig, text: "ac_add_options --disable-necko-wifi"}

  - id: D-157-23
    title: "Search: no partner code sent with searches"
    decided: 2026-10-02
    by: maintainer
    provenance: chat 2026-10-02 ("no faking calling home")
    status: enforced
    why: >
      Searches no longer carry Mozilla's partner code (client=firefox-b-d), which tells the search engine the
      request came from a Firefox build. Cost: none visible.
    verify:
      - tree_lacks: {path: services/settings/dumps/main/search-config-v2.json, text: "firefox-b-d"}

  - id: D-157-24
    title: Gorilla branding everywhere, and every logo crisp (no Nightly leftovers)
    decided: 2026-10-02
    by: maintainer
    provenance: 'chat 2026-10-02, screenshot of the About window ("the window where it says... Nightly... the image is blurry")'
    status: enforced
    why: >
      The About window showed Mozilla's "Nightly" wordmark and a logo made from a soft copy (edge energy 12.6 where
      the master gives 29.3). Every logo raster must come from the master, and no Nightly or Mozilla update link may
      remain. The existing logo check only looked at about-logo.svg, so the PNGs went unchecked.
    verify:
      - image_sharp: {path: browser/branding/gorilla/content/about-logo.png, master: "owner:gorilla-patchset/deb_template/usr/share/icons/hicolor/1024x1024/apps/gorilla-unleashed.png"}
      - tree_lacks: {path: browser/branding/gorilla/content/about-wordmark.svg, text: "m334.11 76.65"}
      - tree_lacks: {path: browser/branding/gorilla/pref/firefox-branding.js, text: "nightly.mozilla.org"}

  - id: D-157-25
    title: "Safe Browsing (malware, phishing) and captive-portal detection are OFF: the build wins over old docs and the audit script"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03, consistency briefs CONS-001..005, owner answer: "1 build, 2 restore, 3 build, 4 as is, 5 make true"'
    status: enforced
    why: >
      Both need Google or Mozilla servers (list updates, portal probes), which breaks D-157-00. The 05.PREFS log
      ("deliberately KEPT ON") and KEPT_DOORS in audit_privacy_claims.py are corrected to match. Cost: no built-in
      phishing/malware lists (uBlock still blocks known bad hosts); hotel/airport Wi-Fi login pages must be opened by hand.
    verify:
      - pref: {name: browser.safebrowsing.malware.enabled, value: false, locked: true}
      - pref: {name: browser.safebrowsing.phishing.enabled, value: false, locked: true}
      - pref: {name: network.captive-portal-service.enabled, value: false, locked: true}

  - id: D-157-26
    title: "distribution/policies.json is restored: the redundant runtime lock (the Mozambique drill's policy layer) ships in every install"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03, consistency briefs CONS-001..005, owner answer: "1 build, 2 restore, 3 build, 4 as is, 5 make true"'
    status: enforced
    why: >
      The policy file re-locks Normandy, experiments and other doors at runtime even if a pref were somehow changed.
      It was in the tree but missing from the 155.0.1 and 157 installs. Invisible to users.
    verify:
      - installed_present: [distribution/policies.json]

  - id: D-157-27
    title: "Add-on updates stay OFF (D-157-21): the audit script's KEPT_DOORS is corrected"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03, consistency briefs CONS-001..005, owner answer: "1 build, 2 restore, 3 build, 4 as is, 5 make true"'
    status: enforced
    why: >
      Update checks would contact Mozilla. uBlock Origin updates with each new Gorilla build; its filter lists update
      by themselves. The add-on blocklist stays as it ships.
    verify:
      - pref: {name: extensions.update.enabled, value: false, locked: true}

  - id: D-157-28
    title: "Cookies, sessions and site storage are kept on shutdown (accepted as is)"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03, consistency briefs CONS-001..005, owner answer: "1 build, 2 restore, 3 build, 4 as is, 5 make true"'
    status: trade-off
    why: >
      Users stay logged in after a restart. Clearing on shutdown is better for privacy but logs everyone out every time;
      users can still clear data themselves. Recorded so the shipped value is a decision, not an accident.

  - id: D-157-29
    title: "Glean instrumentation is cut from nsSocketTransport2 at the source, so the public wording (removed) is true"
    decided: 2026-10-03
    by: maintainer
    provenance: 'chat 2026-10-03, consistency briefs CONS-001..005, owner answer: "1 build, 2 restore, 3 build, 4 as is, 5 make true"'
    status: enforced
    audit: >
      2026-10-04: the source cut is in (patch 22.EGRESS.LOCKDOWN.157/037, three PHYSICAL LOCK comments in
      nsSocketTransport2.cpp, no glean:: call left); the check named in pending_on is added and the entry enforced,
      as pending_on said. Builds 18 to 21 carry the cut.
    why: >
      WHAT-WE-CHANGED says Glean was removed from nsSocketTransport2, while the 157 tree still has gated glean:: calls.
      Make the sentence true. No user impact.
    verify:
      - tree_lacks: {path: netwerk/base/nsSocketTransport2.cpp, text: "glean::"}
