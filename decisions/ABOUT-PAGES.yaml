  - {name: windows-messages, verdict: remove, shown: gone, decision: D-157-36, network: none, why: "Recorded window messages all the time just for this page."}
  - {name: logo, verdict: remove, shown: gone, decision: D-157-35, network: none, why: "Only showed the master logo, upscaled."}
  - {name: translations, verdict: remove, shown: gone, decision: D-157-03, network: "automatic (translation models from Mozilla)", why: "Translations are excised."}
  - {name: aichatcontent, verdict: remove, shown: gone, decision: D-157-00, network: n/a, why: "AI window excised."}
  - {name: aitab, verdict: remove, shown: gone, decision: D-157-00, network: n/a, why: "AI window excised."}
